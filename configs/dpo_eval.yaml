# DPO safety/refusal evaluation config.

# Sample sizes (per dataset). Set to null to use the full dataset.
hh_rlhf_n: 200       # Anthropic/hh-rlhf harmless-base test split
harmfulqa_n: 200     # declare-lab/HarmfulQA
advbench_n: 200      # walledai/AdvBench

# Generation
max_new_tokens: 512

# Output location (per-model subdirs created automatically)
output_dir: outputs/dpo_eval

# Judge: connects to vLLM server (start with scripts/start_judge_server.py)
judge:
  model_name: Qwen/Qwen2.5-14B-Instruct
  server_url: http://localhost:8000/v1
  api_key: EMPTY
  max_tokens: 1024
  temperature: 0.0
  timeout: 180.0
