# Steering sweep, one direction per invocation (--side it | dpo).
#
# These are the frozen primary steering protocol's settings (Task 014): 5 relative
# coefficients x the last 5 layers x a frozen partition, mean direction, relative
# normalisation. An endpoint-backed run only classifies as protocol_profile=primary_v1
# when every field below is exactly this; --random-control, --mode ablate, and a
# single-layer --layers override remain available as explicitly labelled secondary
# profiles (see classify_protocol_profile in scripts/steer_sweep.py).

prompt_source: harmfulqa

# calibration is the frozen default HarmfulQA evaluation partition (protocol Section
# 7). Development pilots override this with --partition development on the CLI.
# construction and final_evaluation are rejected by the script itself.
prompt_partition: calibration

# Not consulted for prompt_source=harmfulqa: the named partition is loaded in full.
n_prompts: 300

# Frozen primary coefficients (protocol Section 7), given as magnitudes; --side
# supplies the sign: +lambda on the IT checkpoint, -lambda on DPO.
lambdas: [0.01, 0.025, 0.05, 0.075, 0.10]

# layers_last_k=5 on a 32-layer checkpoint (both frozen pairs) resolves to the frozen
# primary layer set [27, 28, 29, 30, 31] (protocol Section 6).
layers_last_k: 5

# "mean" is the frozen primary direction (protocol Section 6, Eq. 2). Set "pc3" to
# reproduce what the v1 notebook actually ran -- the two are near-orthogonal, so this
# is a real fork, not a detail. Never labelled primary_v1 (see classify_protocol_profile).
vector_method: mean

# "relative" is frozen for the primary protocol: it rescales the vector to the mean
# activation norm at its layer, making lambda a dimensionless fraction of typical
# activation magnitude and comparable across the two model pairs.
vector_normalise: relative

positions: all
preserve_norm: false

# Construction-profile root: the vector is always built from
# <activations_dir>/<model_name>/construction/activations.pt, the frozen manifest's
# construction partition -- independent of this sweep's own prompt_source/partition.
activations_dir: outputs/layer_profile

max_new_tokens: 512
batch_size: null      # null -> sized from free VRAM
max_input_length: 2048

output_dir: outputs/steer
