# Layer profile analysis config.
# Computes per-layer cosine similarity, norm differences, and SVD/PC0 explained variance.

# Protocol construction (Section 5/6): the frozen manifest's construction partition,
# loaded in full through load_harmfulqa_partition -- not sampled, truncated, or
# reshuffled. n_prompts is not consulted for this source.
prompt_source: harmfulqa
prompt_partition: construction

# prompt_last is the protocol's direction-construction readout (Section 6); required
# whenever prompt_source is harmfulqa.
token_position: prompt_last

# Maximum input token length.
max_input_length: 512

# Output location. The construction run lands under <output_dir>/<model_name>/construction/.
output_dir: outputs/layer_profile
